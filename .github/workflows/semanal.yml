name: Relatório Semanal CNPJ

on:
  schedule:
    - cron: '0 8 * * 1'   # toda segunda-feira às 08:00 UTC
  workflow_dispatch:        # permite disparo manual pela UI do GitHub

jobs:
  gerar-relatorio:
    runs-on: ubuntu-latest

    # Permissão de escrita necessária para o commit do cnpjs_vistos.csv
    permissions:
      contents: write

    steps:

      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 1          # histórico mínimo; só precisamos do HEAD

      # ── 2. Java 17 ─────────────────────────────────────────────────────────
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Cache do Maven ──────────────────────────────────────────────────
      - name: Cache do repositório Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ── 4. Build ───────────────────────────────────────────────────────────
      - name: Compilar projeto
        run: mvn package -DskipTests --batch-mode --quiet

      # ── 5. Executar ────────────────────────────────────────────────────────
      - name: Gerar relatório
        run: java -jar target/cnpj-semanal.jar
        env:
          # Aumente o heap se os ZIPs da Receita Federal forem muito grandes.
          # 6 GB cobre confortavelmente o mapa de razões sociais em memória.
          JAVA_TOOL_OPTIONS: "-Xmx6g"

      # ── 6. Upload do XLSX como artefato ────────────────────────────────────
      - name: Upload do relatório XLSX
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cnpj-${{ github.run_id }}
          path: output/*.xlsx
          retention-days: 30
          if-no-files-found: warn   # não quebra o job se a lista vier vazia

      # ── 7. Commit do histórico de CNPJs ────────────────────────────────────
      - name: Commit do cnpjs_vistos.csv atualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/cnpjs_vistos.csv

          # Só faz commit se houver mudança real no arquivo
          if git diff --cached --quiet; then
            echo "Nenhum CNPJ novo encontrado esta semana. Commit ignorado."
          else
            SEMANA=$(date -u '+%Y-%m-%d')
            git commit -m "chore: atualiza cnpjs_vistos.csv — semana $SEMANA [skip ci]"
            git push
          fi
